services:
  flux-mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [fluxdata:/data/db]
  flux-server:
    build: ./server
    restart: unless-stopped
    depends_on: [flux-mongo]
    environment:
      PORT: "4000"
      MONGODB_URI: mongodb://flux-mongo:27017/flux
      AUTOSEED: "false"
      ADMIN_TOKEN: test
      ALERT_WINDOW_SECONDS: "4"
      ALERT_CRON: "*/4 * * * * *"
    ports: ["4000:4000"]
  flux-client:
    build:
      context: ./client
      args:
        VITE_FLUX_API_URL: http://localhost:4000
        VITE_FLUX_API_KEY: ${FLUX_DASH_KEY:-}
    ports: ["8081:80"]
volumes:
  fluxdata: